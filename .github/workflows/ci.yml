name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI never opens a debugger, and debug info is most of the link time on Windows.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the window's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev build-essential

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # the stable branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The app crate embeds the built frontend, so it comes first.
      - name: Build the frontend
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      # In Chromium and in WebKit, under the app's content security policy.
      - name: Frontend tests
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          bunx playwright install --with-deps chromium webkit
          bun run test

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # Windows keeps less in one entry of its secret store than a sign-in
      # token is long. This writes one that long to the runner's own store.
      - name: The real secret store holds a long token
        if: runner.os == 'Windows'
        run: cargo test -p brolga-platform --locked -- --ignored

      # A debug build, so it reuses what the tests just compiled. Optimised,
      # packaged builds belong to the release workflow.
      - name: Build the app
        working-directory: app
        run: bun run tauri build --debug --no-bundle

  supply-chain:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  # Everything that reads what a stranger wrote is given a minute of
  # nonsense: a message's HTML, a vCard file, a PST file, a search, and how
  # an event repeats. A crash, a hang or a broken promise fails the build.
  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    env:
      # The fuzzer's own instrumentation trips lints meant for the client.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # the nightly branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      # A PST file is checked from end to end before it is read, so the
      # fuzzer starts from a real one.
      - name: A PST file to begin from
        run: |
          mkdir -p fuzz/corpus/pst
          cargo run --release -p brolga-pst --example make_big -- fuzz/corpus/pst/seed.pst 0 0 0
      # The fuzzer is told the target: the copy installed here would
      # otherwise build for the one it was built for itself.
      - name: Fuzz
        run: |
          for target in html vcard search recurrence; do
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- -max_total_time=60 -timeout=10 -rss_limit_mb=2048
          done
          cargo fuzz run --target x86_64-unknown-linux-gnu pst -- -max_total_time=60 -max_len=1048576 -timeout=20 -rss_limit_mb=4096
      - name: Keep what broke it
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
