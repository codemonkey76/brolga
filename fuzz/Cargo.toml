# Fuzzing of everything that reads what a stranger wrote: `cargo +nightly
# fuzz run <target>` from the repository's top. Not part of the client.
[package]
name = "brolga-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Its own workspace, so the client's builds never see it.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
brolga-calendar = { path = "../crates/calendar" }
brolga-contacts = { path = "../crates/contacts" }
brolga-mail = { path = "../crates/mail" }
brolga-pst = { path = "../crates/pst" }
brolga-search = { path = "../crates/search" }
jiff = "0.2"
serde_json = "1"

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vcard"
path = "fuzz_targets/vcard.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pst"
path = "fuzz_targets/pst.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search"
path = "fuzz_targets/search.rs"
test = false
doc = false
bench = false

[[bin]]
name = "recurrence"
path = "fuzz_targets/recurrence.rs"
test = false
doc = false
bench = false
