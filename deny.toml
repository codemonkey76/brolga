# What a dependency must be for it to be let in. Checked on every merge.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
ignore = [
    # A build-time macro helper that is no longer maintained. It comes in
    # through the GTK 3 bindings Tauri 2 uses for its Linux window, so it
    # stays until Tauri moves off them. It handles no mail and no network.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via Tauri 2's GTK 3 bindings on Linux" },
]

[licenses]
version = 2
# Permissive licences, which sit with either licence Brolga may end up under.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
]

[licenses.private]
# Brolga's own crates have no licence yet: that is an open decision.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
