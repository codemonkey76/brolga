[workspace]
resolver = "3"
members = ["crates/*", "testing/fake-graph", "app/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[workspace.dependencies]
brolga-commands = { path = "crates/commands" }
brolga-control = { path = "crates/control" }
brolga-mcp = { path = "crates/mcp" }
brolga-fake-graph = { path = "testing/fake-graph" }

axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
interprocess = { version = "2", features = ["tokio"] }
jsonschema = { version = "0.58", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# No unwrap() or expect() where network or user data is handled: an error is
# reported, not a crash. Tests may use both (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
