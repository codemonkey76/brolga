[package]
name = "brolga-core"
description = "The client with no window: its accounts, its data and every command, assembled."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
brolga-ai.workspace = true
brolga-auth.workspace = true
brolga-calendar = { path = "../calendar" }
brolga-contacts = { path = "../contacts" }
brolga-pst = { path = "../pst" }
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
brolga-commands.workspace = true
brolga-graph.workspace = true
brolga-mail = { path = "../mail" }
brolga-ops.workspace = true
brolga-search = { path = "../search" }
brolga-store.workspace = true
brolga-sync.workspace = true
futures.workspace = true
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# Makes the PST files the tests import. Never part of the client itself.
pst-writer = { package = "outlook-pst-rw", version = "1.2" }
axum.workspace = true
brolga-fake-graph.workspace = true
brolga-fake-ai.workspace = true

[lints]
workspace = true
