[package]
name = "brolga-calendar"
description = "Calendar domain logic: recurrence, time zones and invitations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The time zone database is built in, so a date falls the same on every
# computer, whatever zone data it has or lacks of its own.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
serde = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
