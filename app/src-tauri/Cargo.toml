[package]
name = "brolga-app"
description = "The window: shows what the core holds and sends it commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "brolga_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "brolga"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brolga-commands.workspace = true
brolga-control.workspace = true
brolga-core.workspace = true
brolga-auth.workspace = true
brolga-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio.workspace = true

[lints]
workspace = true
